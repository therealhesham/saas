services:
  app:
    build:
      context: .
      secrets:
        - database_url
    image: rawaes-site
    container_name: rawaes-site-app
    restart: unless-stopped
    # الأسرار بتتقري وقت التشغيل من .env مش متخبّية جوه الصورة
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      # تقدر تضيف/تغيّر سكرين شوت اللاب توب من غير ما تعيد بناء الصورة
      - ./public/screenshots:/app/public/screenshots:ro

  # MySQL محلي للتطوير بس — مابيشتغلش افتراضياً لأن المشروع على داتابيز خارجية.
  # لو احتجته: docker compose --profile local-db up -d mysql
  mysql:
    profiles: ["local-db"]
    image: mysql:8.0
    container_name: rawaes-site-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rawaes_root
      MYSQL_DATABASE: rawaes_site
      MYSQL_USER: rawaes
      MYSQL_PASSWORD: rawaes_pass
    # بورت 3307 على الجهاز عشان مايتعارضش مع أي MySQL تاني شغال
    ports:
      - "3307:3306"
    volumes:
      - rawaes-site-db:/var/lib/mysql
      # بيتنفّذ مرة واحدة أول ما الداتا فوليوم يتعمل من الصفر
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prawaes_root"]
      interval: 5s
      timeout: 5s
      retries: 20

# الصفحة الرئيسية بتتولّد وقت البناء وبتقرأ من الداتابيز، فالرابط لازم يتمرّر
# للبناء. بيتمرّر كـ secret مش ARG عشان ما يتسجّلش في طبقات الصورة.
# كومبوز بيقرأ DATABASE_URL من ملف .env تلقائياً.
secrets:
  database_url:
    environment: DATABASE_URL

volumes:
  rawaes-site-db:
