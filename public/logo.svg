<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8862B" />
      <stop offset="50%" stop-color="#D4A24A" />
      <stop offset="100%" stop-color="#E8BE70" />
    </linearGradient>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 0)">
    <!-- 4 Navy Square Pixels -->
    <rect x="20" y="86" width="10" height="10" rx="1.5" fill="#0D1B3D" />
    <rect x="20" y="99" width="10" height="10" rx="1.5" fill="#0D1B3D" />
    <rect x="33" y="99" width="10" height="10" rx="1.5" fill="#0D1B3D" />
    <rect x="46" y="99" width="10" height="10" rx="1.5" fill="#0D1B3D" />

    <!-- Gold Swoosh -->
    <path d="M 44 110 C 40 92, 48 74, 66 60 C 78 51, 90 47, 102 47 C 98 58, 89 66, 78 71 C 65 77, 57 90, 57 110 Z" fill="url(#gold-grad)" />

    <!-- Navy R Mark -->
    <path d="M 22 36 C 22 25, 34 18, 60 18 L 95 18 C 120 18, 134 30, 134 48 C 134 64, 123 75, 104 79 L 135 120 C 138 124, 135 128, 129 128 L 110 128 C 105 128, 101 125, 97 120 L 73 86 L 60 86 C 54 86, 49 90, 49 95 L 49 110 C 49 119, 38 123, 33 115 C 25 105, 22 84, 22 74 L 22 36 Z M 60 36 L 60 64 L 88 64 C 100 64, 108 58, 108 50 C 108 42, 100 36, 88 36 Z" fill="#0D1B3D" fill-rule="evenodd" />
  </g>

  <!-- DIVIDER LINE -->
  <line x1="165" y1="20" x2="165" y2="120" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(190, 0)">
    <!-- RAWAES Main Text -->
    <text x="0" y="62" font-family="'Cairo', 'Segoe UI', sans-serif" font-weight="900" font-size="46" fill="#0D1B3D" letter-spacing="4">RAWAES</text>

    <!-- Gold triangle accent over second A -->
    <polygon points="135,26 140,34 130,34" fill="#D4A24A" />

    <!-- Arabic Subtitle with Gold Lines -->
    <line x1="0" y1="84" x2="24" y2="84" stroke="#D4A24A" stroke-width="2" stroke-linecap="round" />
    <text x="32" y="89" font-family="'Cairo', sans-serif" font-weight="700" font-size="16" fill="#0D1B3D">روائس للحلول البرمجية</text>
    <line x1="194" y1="84" x2="218" y2="84" stroke="#D4A24A" stroke-width="2" stroke-linecap="round" />

    <!-- English Subtitle -->
    <text x="0" y="112" font-family="'Cairo', sans-serif" font-weight="700" font-size="11" fill="#D4A24A" letter-spacing="6">SOFTWARE SOLUTIONS</text>
  </g>
</svg>
